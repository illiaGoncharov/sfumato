<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sfumato · audio spike</title>
<script src="../vendor/Tone.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0d12;
    color: #e8eefa;
    font: 14px/1.5 "IBM Plex Mono", monospace;
  }
  .card {
    max-width: 420px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    text-align: center;
  }
  button {
    margin-top: 16px;
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(20,24,32,0.9);
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  p { color: #8b8982; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1 style="font-weight:400;font-style:italic;margin:0 0 8px">audio spike</h1>
  <p>60s ambient in the spirit of Noto × Sakamoto (Vrioon–Summvs). Headphones recommended.</p>
  <button id="go">Start listening</button>
  <p id="status"></p>
</div>
<script type="module">
import { startAudio, playBurst, playChord, updateAmbient, pingFromHue } from "../js/audio.js?v=7";
const Tone = globalThis.Tone;

const SCALE_HUES = [30, 80, 150, 200, 260, 310];
let t0 = 0;

document.getElementById("go").addEventListener("click", async () => {
  await startAudio();
  t0 = Tone.now();
  document.getElementById("status").textContent = "playing…";
  schedule();
});

function schedule() {
  const loop = new Tone.Loop(time => {
    if (Math.random() < 0.35) playBurst();
    updateAmbient({ nearCount: 2 + Math.random() * 5, handYNorm: Math.random() });
    pingFromHue(SCALE_HUES[(Math.random() * SCALE_HUES.length) | 0]);
    if (Math.random() < 0.12) {
      playChord([
        SCALE_HUES[(Math.random() * 3) | 0],
        SCALE_HUES[(Math.random() * 3 + 2) | 0],
        SCALE_HUES[(Math.random() * 3 + 4) | 0],
      ]);
    }
  }, "2n").start(0);

  Tone.Transport.start();
  setTimeout(() => {
    Tone.Transport.stop();
    loop.dispose();
    document.getElementById("status").textContent = "done (60s)";
  }, 60000);
}
</script>
</body>
</html>
